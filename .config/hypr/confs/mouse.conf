#####################
# EXTERNAL MOUSE    #
#####################
# Per-device settings override the global input{} block for that specific device.
# To find the name of any new mouse you plug in, run: hyprctl devices
# Then copy the template block below and paste in the device name.
#
# sensitivity: -1.0 (slowest) to 1.0 (fastest), 0.0 = no modification
# accel_profile: flat (no acceleration, linear) | adaptive (OS-managed acceleration)
# scroll_factor: multiplier for scroll wheel speed (1.0 = default)

# --- Current Mouse: INSTANT USB GAMING MOUSE ---
device {
    name = instant-usb-gaming-mouse-
    sensitivity = -0.2         # Adjust: -1.0 (slow) to 1.0 (fast)
    accel_profile = flat      # flat = no acceleration (recommended for gaming/precision)
    scroll_factor = 1.0       # Scroll wheel speed multiplier
    natural_scroll = false
}

# --- Template: Add any future mouse here ---
# 1. Plug in your mouse
# 2. Run `hyprctl devices` and copy the name under "Mouse at ..."
# 3. Uncomment and fill in the block below:
